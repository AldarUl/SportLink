spring:
  application:
    name: sportlink-app
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sportlink}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  messages:
    basename: messages
    encoding: UTF-8
    use-code-as-default-message: true   # если ключ не найден, вернуть сам ключ
    fallback-to-system-locale: false
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB



server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs

management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoints:
    web:
      exposure:
        include: health,info

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET:dev-secret-should-be-very-long}
    accessTtlMinutes: 15
    refreshTtlDays: 30
    issuer: sportlink
  refreshCookie:
    name: refreshToken
    path: /api/v1/auth/refresh
    sameSite: Strict
    secure: true

sportlink:
  events:
    cleanup-cron: "0 */5 * * * *"   # каждые 5 минут
    retention-days: 7               # держим прошедшие 7 дней (0 — удалять сразу)
    cleanup-batch-size: 500
    end-grace-minutes: 10           # небольшой запас к фактическому окончанию
    # через сколько дней после окончания чистить FINISHED
    retentionDays: 30
    # можно выключить обработчик (например, для профиля разработки)
    lifecycleEnabled: false

# где хранить файлы (AvatarServiceImpl читает app.files.root)
app:
  files:
    root: ./var

nextcloud:
  base-url: ${NEXTCLOUD_BASE_URL:http://localhost:8081}
  username: ${NEXTCLOUD_USER:sportlink}
  password: ${NEXTCLOUD_PASSWORD:secret}
  avatars-root: ${NEXTCLOUD_AVATARS_ROOT:/remote.php/dav/files/sportlink/SportLink/avatars}
