spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/sportlink
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

logging:
  level:
    root: INFO
    com.sportlink: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

server:
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,threaddump,httpexchanges
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: sportlink-app

nextcloud:
  base-url: ${NEXTCLOUD_BASE_URL:http://localhost:8081}
  username: ${NEXTCLOUD_USER:sportlink}
  password: ${NEXTCLOUD_PASSWORD:secret}
  avatars-root: ${NEXTCLOUD_AVATARS_ROOT:/remote.php/dav/files/sportlink/SportLink/avatars}
