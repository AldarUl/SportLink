# === Spring ===
spring.application.name=sportlink-app

# DataSource (? ?????????? ENV-??????????)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sportlink}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# i18n
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.use-code-as-default-message=true
spring.messages.fallback-to-system-locale=false

# Multipart limits
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB

# Server
server.port=8080

# OpenAPI
springdoc.api-docs.path=/api-docs

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# === Security (????????? ?????????) ===
security.jwt.secret=${SECURITY_JWT_SECRET:dev-secret-should-be-very-long}
security.jwt.accessTtlMinutes=15
security.jwt.refreshTtlDays=30
security.jwt.issuer=sportlink

security.refreshCookie.name=refreshToken
security.refreshCookie.path=/api/v1/auth/refresh
security.refreshCookie.sameSite=Strict
security.refreshCookie.secure=true

# === ?????????? ===
# ?????? ??? ?????? (??????? ? ?.?.)
app.files.root=./var

# ???????: ??????? ??????/?????????
sportlink.events.cleanup-cron=0 */5 * * * *
sportlink.events.retention-days=7
sportlink.events.cleanup-batch-size=500
sportlink.events.end-grace-minutes=10
sportlink.events.retentionDays=30
sportlink.events.lifecycleEnabled=true
